<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topo Background - RobaLink</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #f4f4f9;
        }

        body {
            position: relative;
        }

        #draft-bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            filter: blur(1.5px);
        }

        #draft-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #draft-overlay {
            position: absolute;
            display: block;
        }

        #main-header {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        main {
            position: relative;
            z-index: 1;
        }

        #hero {
            min-height: 150vh;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div id="draft-bg-layer" aria-hidden="true">
        <canvas id="draft-overlay"></canvas>
        <canvas id="draft-bg"></canvas>
    </div>

    <header id="main-header"></header>

    <main>
        <section id="hero"></section>
    </main>

    <script src="../js/anim-controller.js"></script>
    <script src="../js/draft-bg.js"></script>
    <script src="../js/draft-overlay.js"></script>
    <script>
        new DraftBackground('draft-bg').start();
        new DraftOverlay('draft-overlay').start();
    </script>
</body>

</html>
