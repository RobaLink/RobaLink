<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobaLink</title>
    <meta name="description" content="RobaLink builds custom software tools and automation for businesses.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.robalink.com/">
    <meta property="og:title" content="RobaLink | Custom Software & Automation">
    <meta property="og:description" content="RobaLink builds custom software for businesses.">
    <meta property="og:image" content="https://www.robalink.com/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.robalink.com/assets/og-image.jpg">
    <meta name="twitter:title" content="RobaLink | Custom Software & Automation">
    <meta name="twitter:description" content="RobaLink builds custom software for businesses.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Segoe+UI&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.lang-loading {
            opacity: 0;
            visibility: hidden;
        }
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('RobaLinkTheme');
                var theme = saved === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>

<body class="lang-loading">
    <!-- SVG Flag Sprites -->
    <svg style="display: none;">
        <symbol id="flag-us" viewBox="0 0 7410 3900">
            <path fill="#b31942" d="M0 0h7410v3900H0" />
            <path stroke="#FFF" stroke-width="300" d="M0 450h7410m0 600H0m0 600h7410m0 600H0m0 600h7410m0 600H0" />
            <path fill="#0a3161" d="M0 0h2964v2100H0" />
            <g fill="#FFF">
                <g id="us-d">
                    <g id="us-c">
                        <g id="us-e">
                            <g id="us-b">
                                <path id="us-a" d="m247 90 70.534 217.082-184.66-134.164h228.253L176.466 307.082z" />
                                <use href="#us-a" y="420" />
                                <use href="#us-a" y="840" />
                                <use href="#us-a" y="1260" />
                            </g>
                            <use href="#us-a" y="1680" />
                        </g>
                        <use href="#us-b" x="247" y="210" />
                    </g>
                    <use href="#us-c" x="494" />
                </g>
                <use href="#us-d" x="988" />
                <use href="#us-c" x="1976" />
                <use href="#us-e" x="2470" />
            </g>
        </symbol>
        <symbol id="flag-nl" viewBox="0 0 9 6">
            <path fill="#21468B" d="M0 0h9v6H0z" />
            <path fill="#FFF" d="M0 0h9v4H0z" />
            <path fill="#AE1C28" d="M0 0h9v2H0z" />
        </symbol>
        <symbol id="flag-de" viewBox="0 0 5 3">
            <path d="M0 0h5v3H0z" />
            <path fill="#D00" d="M0 1h5v2H0z" />
            <path fill="#FFCE00" d="M0 2h5v1H0z" />
        </symbol>
    </svg>

    <!-- Background layer (topo + HUD frame, shared blur) -->
    <div id="draft-bg-layer" aria-hidden="true">
        <canvas id="draft-overlay"></canvas>
        <canvas id="draft-bg"></canvas>
    </div>

    <!-- Navigation -->
    <header id="main-header">
        <div class="container header-container">
            <a href="#hero" id="logo-link" class="logo">
                <img src="assets/logo.svg" alt="RobaLink Logo">
            </a>
            <nav>
                <div class="nav-controls">
                    <button type="button" class="theme-toggle" aria-label="Switch to dark mode" data-i18n-aria="theme_to_dark">
                        <i class="fas fa-moon theme-icon-dark" aria-hidden="true"></i>
                        <i class="fas fa-sun theme-icon-light" aria-hidden="true"></i>
                    </button>
                    <div class="lang-switcher">
                        <button class="lang-toggle" aria-label="Change Language">
                            <svg class="flag-icon">
                                <use href="#flag-us"></use>
                            </svg> <i class="fas fa-chevron-down"></i>
                        </button>
                        <ul class="lang-menu">
                            <li><button data-lang="en"><svg class="flag-icon">
                                        <use href="#flag-us"></use>
                                    </svg> English (EN)</button></li>
                            <li><button data-lang="nl"><svg class="flag-icon">
                                        <use href="#flag-nl"></use>
                                    </svg> Nederlands (NL)</button></li>
                            <li><button data-lang="de"><svg class="flag-icon">
                                        <use href="#flag-de"></use>
                                    </svg> Deutsch (DE)</button></li>
                        </ul>
                    </div>
                </div>
                <ul class="nav-links">
                    <li><a href="#hero" data-i18n="nav_home">Home</a></li>
                    <li><a href="#about" data-i18n="nav_about">About</a></li>
                    <li><a href="#showcase" data-i18n="nav_showcase">Creative Mindstorms</a></li>
                    <li><a href="#contact-area" class="btn-nav" data-i18n="nav_contact">Contact</a></li>
                </ul>
                <div class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="hero" class="hero-section">
            <div class="container">
                <header class="hero-header">
                    <h1 data-i18n="hero_title"></h1>
                </header>

                <div class="pipeline">
                    <!-- Input Stage -->
                    <div class="card">
                        <div class="label-top" data-i18n="hero_input_label"></div>
                        <div class="visual-container">
                            <div class="sketch-visual visual-box">
                                <div class="sketch-line"></div>
                                <div class="sketch-line short"></div>
                                <div class="sketch-line"></div>
                                <div class="pencil"><i class="fas fa-pencil-alt"></i></div>
                            </div>
                        </div>
                        <div class="label-desc" data-i18n="hero_input_desc"></div>
                    </div>

                    <div class="arrow-container">
                        <div class="arrow-icon">➜</div>
                    </div>

                    <!-- Solution Stage -->
                    <div class="card outstanding">
                        <div class="label-top highlight-text" data-i18n="hero_solution_label"></div>
                        <div class="visual-container">
                            <div class="mini-editor">
                                <div class="editor-header">
                                    <div class="dot red"></div>
                                    <div class="dot yellow"></div>
                                    <div class="dot green"></div>
                                </div>
                                <div class="editor-content">
                                    <code id="typewriter-code"></code><span class="cursor"></span>
                                </div>
                            </div>
                        </div>
                        <div class="label-desc" data-i18n="hero_solution_desc"></div>
                    </div>

                    <div class="arrow-container">
                        <div class="arrow-icon">➜</div>
                    </div>

                    <!-- Outcome Stage -->
                    <div class="card">
                        <div class="label-top" data-i18n="hero_outcome_label"></div>
                        <div class="visual-container">
                            <div class="result-visual visual-box">
                                <div class="bar" style="height: 30%"></div>
                                <div class="bar" style="height: 50%"></div>
                                <div class="bar" style="height: 80%"></div>
                                <div class="bar" style="height: 60%"></div>
                            </div>
                        </div>
                        <div class="label-desc" data-i18n="hero_outcome_desc"></div>
                    </div>
                </div>
            </div>

            <div class="scroll-down">
                <a href="#about"><i class="fas fa-chevron-down"></i></a>
            </div>
        </section>

        <section id="about" class="tailored-section">
            <div class="container">
                <h2 data-i18n="about_title"></h2>
                <div class="tailored-intro">
                    <p data-i18n="about_p1"></p>
                    <p data-i18n="about_p2"></p>
                </div>
            </div>
        </section>

        <!-- Laptop UI showcase (horizontal drift on page scroll) -->
        <section id="laptop-showcase" class="laptop-showcase" aria-label="Software examples">
            <div class="laptop-track-enter">
                <div class="laptop-track" id="laptop-track"></div>
            </div>
        </section>

        <template id="laptop-tpl-analytics">
            <figure class="laptop">
                <div class="laptop-device">
                    <div class="laptop-screen">
                        <div class="laptop-bezel" aria-hidden="true">
                            <span class="laptop-camera"></span>
                        </div>
                        <div class="laptop-screen-inner">
                            <div class="ui-mock ui-analytics" aria-hidden="true">
                                <div class="ui-nav"><span></span><span></span><span class="active"></span><span></span></div>
                                <div class="ui-cards">
                                    <div class="ui-card">
                                        <span class="ui-card-title"></span>
                                        <div class="ui-viz ui-viz-line"></div>
                                    </div>
                                    <div class="ui-card">
                                        <span class="ui-card-title"></span>
                                        <div class="ui-viz ui-viz-bar">
                                            <span style="--h:45%"></span><span style="--h:72%"></span><span style="--h:38%"></span><span style="--h:60%"></span>
                                        </div>
                                    </div>
                                    <div class="ui-card">
                                        <span class="ui-card-title"></span>
                                        <div class="ui-viz ui-viz-pie"></div>
                                    </div>
                                    <div class="ui-card">
                                        <span class="ui-card-title"></span>
                                        <div class="ui-viz ui-viz-list"><span></span><span></span><span></span><span></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="laptop-base"></div>
                </div>
            </figure>
        </template>

        <template id="laptop-tpl-invoice">
            <figure class="laptop">
                <div class="laptop-device">
                    <div class="laptop-screen">
                        <div class="laptop-bezel" aria-hidden="true">
                            <span class="laptop-camera"></span>
                        </div>
                        <div class="laptop-screen-inner">
                            <div class="ui-mock ui-invoice" aria-hidden="true">
                                <div class="ui-form">
                                    <div class="ui-field"><span class="ui-label"></span><span class="ui-input lg"></span></div>
                                    <div class="ui-field-row">
                                        <div class="ui-field"><span class="ui-label short"></span><span class="ui-input"></span></div>
                                        <div class="ui-field"><span class="ui-label short"></span><span class="ui-input"></span></div>
                                    </div>
                                    <div class="ui-field"><span class="ui-label"></span><span class="ui-input lg"></span></div>
                                    <div class="ui-field"><span class="ui-label short"></span><span class="ui-input"></span></div>
                                    <div class="ui-field"><span class="ui-label"></span><span class="ui-input area"></span></div>
                                </div>
                                <div class="ui-preview">
                                    <div class="ui-doc">
                                        <div class="ui-doc-head"><span class="ui-doc-logo"></span><span class="ui-doc-no"></span></div>
                                        <div class="ui-doc-meta"><span></span><span></span></div>
                                        <div class="ui-doc-lines">
                                            <div class="ui-doc-line head"><span></span><span></span><span></span></div>
                                            <div class="ui-doc-line"><span></span><span></span><span></span></div>
                                            <div class="ui-doc-line"><span></span><span></span><span></span></div>
                                            <div class="ui-doc-line"><span></span><span></span><span></span></div>
                                        </div>
                                        <div class="ui-doc-total"><span></span><span></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="laptop-base"></div>
                </div>
            </figure>
        </template>

        <template id="laptop-tpl-controlpanel">
            <figure class="laptop">
                <div class="laptop-device">
                    <div class="laptop-screen">
                        <div class="laptop-bezel" aria-hidden="true">
                            <span class="laptop-camera"></span>
                        </div>
                        <div class="laptop-screen-inner">
                            <div class="ui-mock ui-controlpanel" aria-hidden="true">
                                <div class="ui-cp-nav"><span class="active"></span><span></span><span></span><span></span></div>
                                <div class="ui-cp-main">
                                    <div class="ui-cp-section">
                                        <span class="ui-cp-heading"></span>
                                        <div class="ui-cp-row"><span class="ui-cp-label"></span><span class="ui-cp-toggle on"></span></div>
                                        <div class="ui-cp-row"><span class="ui-cp-label"></span><span class="ui-cp-toggle"></span></div>
                                        <div class="ui-cp-row"><span class="ui-cp-label short"></span><span class="ui-cp-slider"><span class="ui-cp-slider-fill"></span><span class="ui-cp-slider-thumb"></span></span></div>
                                    </div>
                                    <div class="ui-cp-section">
                                        <span class="ui-cp-heading"></span>
                                        <div class="ui-cp-row"><span class="ui-cp-label"></span><span class="ui-cp-select"></span></div>
                                        <div class="ui-cp-row"><span class="ui-cp-label"></span><span class="ui-cp-status ok"></span></div>
                                        <div class="ui-cp-row"><span class="ui-cp-label"></span><span class="ui-cp-status warn"></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="laptop-base"></div>
                </div>
            </figure>
        </template>

        <template id="laptop-tpl-broadcast">
            <figure class="laptop">
                <div class="laptop-device">
                    <div class="laptop-screen">
                        <div class="laptop-bezel" aria-hidden="true">
                            <span class="laptop-camera"></span>
                        </div>
                        <div class="laptop-screen-inner">
                            <div class="ui-mock ui-broadcast" aria-hidden="true">
                                <div class="ui-edit-bar">
                                    <span></span><span></span><span></span>
                                    <span class="ui-edit-time"></span>
                                    <span class="ui-edit-transport"></span>
                                </div>
                                <div class="ui-edit-upper">
                                    <div class="ui-edit-bin">
                                        <span class="ui-edit-heading"></span>
                                        <div class="ui-edit-clips"><span></span><span></span><span></span><span></span></div>
                                    </div>
                                    <div class="ui-edit-monitor">
                                        <div class="ui-edit-preview"></div>
                                    </div>
                                    <div class="ui-edit-inspector">
                                        <span class="ui-edit-heading"></span>
                                        <span></span><span></span><span></span>
                                    </div>
                                </div>
                                <div class="ui-edit-timeline">
                                    <div class="ui-edit-ruler"></div>
                                    <div class="ui-edit-tracks">
                                        <div class="ui-edit-track">
                                            <span class="ui-edit-lbl"></span>
                                            <div class="ui-edit-lane"><span></span><span></span><span></span></div>
                                        </div>
                                        <div class="ui-edit-track">
                                            <span class="ui-edit-lbl"></span>
                                            <div class="ui-edit-lane"><span></span></div>
                                        </div>
                                        <div class="ui-edit-track audio">
                                            <span class="ui-edit-lbl"></span>
                                            <div class="ui-edit-lane"><span class="wave"></span></div>
                                        </div>
                                    </div>
                                    <span class="ui-edit-playhead"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="laptop-base"></div>
                </div>
            </figure>
        </template>

        <!-- Founder + Contact -->
        <section id="founder" class="founder-section">
            <div class="container">
                <div class="about-founder">
                    <div class="about-photo">
                        <img src="assets/headshot.webp" alt="" class="headshot headshot-light" data-i18n-alt="about_headshot_alt">
                        <img src="assets/headshot-dark.webp" alt="" class="headshot headshot-dark" data-i18n-alt="about_headshot_alt">
                    </div>
                    <div class="about-bio">
                        <p class="about-kicker" data-i18n="about_kicker"></p>
                        <h3 class="about-name">Sten Nellen</h3>
                        <p class="about-text" data-i18n="about_bio"></p>
                        <p class="about-speaking" data-i18n="about_speaking"></p>
                        <div class="about-actions">
                            <a href="https://www.linkedin.com/in/sten-nellen-893992252/" target="_blank"
                                rel="noopener noreferrer" class="btn about-linkedin">
                                <i class="fab fa-linkedin"></i> <span data-i18n="about_linkedin"></span>
                            </a>
                        </div>
                    </div>
                </div>
                <div id="contact-area" class="founder-contact">
                    <h2 data-i18n="contact_title"></h2>
                    <p data-i18n="contact_text"></p>
                    <a href="mailto:info@robalink.com" class="btn btn-primary">
                        <i class="fas fa-envelope"></i> info@robalink.com
                    </a>
                </div>
            </div>
        </section>

        <!-- Creative Mindstorms Showcase -->
        <section id="showcase" class="showcase-section">
            <div class="container">
                <div class="showcase-header text-center">
                    <h2 data-i18n="showcase_title"></h2>
                    <p class="subtitle" data-i18n="showcase_subtitle"></p>
                </div>

                <div class="media-section">
                    <h3><a href="https://www.youtube.com/c/CreativeMindstorms" target="_blank"
                            data-i18n="latest_projects"></a></h3>
                    <div id="video-grid" class="grid-layout">
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <div class="media-section">
                    <h3><a href="https://github.com/CreativeMindstorms" target="_blank" data-i18n="open_source"></a>
                    </h3>
                    <div id="repo-grid" class="grid-layout">
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <div class="showcase-actions text-center">
                    <p data-i18n="check_channels"></p>
                    <div class="social-buttons">
                        <a href="https://www.youtube.com/c/CreativeMindstorms" target="_blank" class="btn-cm-social"><i
                                class="fab fa-youtube"></i> YouTube</a>
                        <a href="https://github.com/CreativeMindstorms" target="_blank" class="btn-cm-social"><i
                                class="fab fa-github"></i> GitHub</a>
                        <a href="https://instagram.com/creative_mindstorms" target="_blank" class="btn-cm-social">
                            <i class="fab fa-instagram"></i> Instagram
                        </a>
                        <a href="https://www.tiktok.com/@creative_mindstorms" target="_blank" class="btn-cm-social">
                            <i class="fab fa-tiktok"></i> TikTok
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer id="contact">
        <div class="container">
            <div class="footer-layout">
                <div class="footer-col brand-col">
                    <img src="assets/logo.svg" alt="" class="footer-logo" data-i18n-alt="alt_logo">
                    <p data-i18n="footer_slogan"></p>
                </div>

                <div class="footer-col info-col">
                    <p><a href="mailto:info@robalink.com" id="contact-email"><i class="fas fa-envelope"></i>
                            info@robalink.com</a></p>
                    <p data-i18n="footer_kvk"></p>
                    <p data-i18n="footer_vat"></p>
                </div>

                <div class="footer-col social-col">
                    <a href="https://linkedin.com/company/robalink" target="_blank" class="social-icon-btn"
                        aria-label="RobaLink on LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/sten-nellen-893992252/" target="_blank" class="social-icon-btn"
                        aria-label="Sten Nellen on LinkedIn">
                        <i class="fas fa-user"></i>
                    </a>
                </div>
            </div>
            <div class="copyright" data-i18n="footer_copyright">
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/draft-bg.js"></script>
    <script src="js/draft-overlay.js"></script>
    <script src="js/laptop-showcase.js"></script>
    <script src="js/typewriter.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
